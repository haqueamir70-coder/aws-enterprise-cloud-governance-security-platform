name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - "policies/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "policies/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, validate and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init --config=../.tflint.hcl
          tflint --recursive --config=../.tflint.hcl

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

      - name: Validate example JSON policies
        run: |
          python -m json.tool policies/scp/deny-leave-organization.json >/dev/null
          python -m json.tool policies/scp/deny-disable-audit-examples.json >/dev/null
          python -m json.tool policies/iam/github-actions-oidc-trust.example.json >/dev/null
