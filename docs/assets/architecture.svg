<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AWS enterprise governance architecture</title>
<desc id="desc">Organization governance and identity issue approved access to workload accounts. GitHub Actions deploys through OIDC. Workload telemetry flows to central audit and security services.</desc>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.h{font-size:25px;font-weight:700}.s{font-size:16px;font-weight:600}.p{font-size:13px}
.org{fill:#fff8ed;stroke:#f59e0b;stroke-width:2}.acct{fill:#f8fbff;stroke:#8ba6c8;stroke-width:2}
.svc{fill:#fff;stroke:#d18b27;stroke-width:1.8}.id{fill:#eef6ff;stroke:#3b82b9;stroke-width:1.7}.security{fill:#f0faf5;stroke:#23966b;stroke-width:1.8}
.line{fill:none;stroke:#52677f;stroke-width:2.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrowOrange);animation:march 5s linear infinite}
@keyframes march{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#52677f"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#f59e0b"/></marker></defs>
<rect x="12" y="12" width="1376" height="796" rx="22" fill="#f6f8fb"/>
<text x="42" y="58" class="h">AWS enterprise governance reference architecture</text><text x="42" y="86" class="p">Identity • Guardrails • Network isolation • Central audit • Detection • Secure delivery</text>
<rect x="42" y="115" width="1316" height="145" rx="16" class="org"/><text x="68" y="148" class="h">AWS Organizations / Control Tower</text>
<rect x="70" y="169" width="220" height="66" rx="10" class="svc"/><text x="88" y="196" class="s">Management account</text><text x="88" y="217" class="p">Organization / landing zone</text>
<rect x="315" y="169" width="220" height="66" rx="10" class="svc"/><text x="333" y="196" class="s">Service Control Policies</text><text x="333" y="217" class="p">Maximum permission boundary</text>
<rect x="560" y="169" width="220" height="66" rx="10" class="svc"/><text x="578" y="196" class="s">Account vending</text><text x="578" y="217" class="p">OU placement / baseline</text>
<rect x="805" y="169" width="220" height="66" rx="10" class="svc"/><text x="823" y="196" class="s">IAM Identity Center</text><text x="823" y="217" class="p">Federated workforce access</text>
<rect x="1050" y="169" width="280" height="66" rx="10" class="svc"/><text x="1068" y="196" class="s">AWS Config / Organizations</text><text x="1068" y="217" class="p">Governance & compliance baseline</text>
<path d="M680 260V302M920 260V302" class="line"/>
<rect x="42" y="310" width="625" height="270" rx="16" class="acct"/><text x="68" y="344" class="h">Workload account (Dev / Test / Prod)</text>
<rect x="70" y="370" width="250" height="72" rx="10" class="id"/><text x="89" y="399" class="s">GitHub Actions</text><text x="89" y="420" class="p">OIDC → STS short-lived role</text>
<rect x="355" y="370" width="280" height="72" rx="10" class="svc"/><text x="375" y="399" class="s">Amazon VPC</text><text x="375" y="420" class="p">Public ingress / private app tier</text>
<rect x="70" y="468" width="250" height="78" rx="10" class="svc"/><text x="89" y="497" class="s">Terraform modules</text><text x="89" y="519" class="p">Reviewed infrastructure changes</text>
<rect x="355" y="468" width="280" height="78" rx="10" class="svc"/><text x="375" y="497" class="s">Workload IAM / KMS</text><text x="375" y="519" class="p">Least privilege / encryption</text>
<path d="M320 406H350M195 442V464" class="line"/>
<rect x="700" y="310" width="658" height="270" rx="16" class="security"/><text x="728" y="344" class="h">Security & log archive accounts</text>
<rect x="728" y="370" width="275" height="72" rx="10" class="svc"/><text x="748" y="399" class="s">AWS CloudTrail</text><text x="748" y="420" class="p">Organization API activity</text>
<rect x="1030" y="370" width="300" height="72" rx="10" class="svc"/><text x="1050" y="399" class="s">Central log archive</text><text x="1050" y="420" class="p">S3 / KMS / retention policy</text>
<rect x="728" y="468" width="275" height="78" rx="10" class="svc"/><text x="748" y="497" class="s">Amazon GuardDuty</text><text x="748" y="519" class="p">Threat detection findings</text>
<rect x="1030" y="468" width="300" height="78" rx="10" class="svc"/><text x="1050" y="497" class="s">AWS Security Hub</text><text x="1050" y="519" class="p">Posture & findings aggregation</text>
<path d="M1003 406H1024M1003 506H1024" class="line"/><path d="M635 406H720" class="flow"/><path d="M635 506H720" class="flow"/><path d="M1000 235V292H1180V360" class="line"/>
<text x="42" y="628" class="h">Control outcomes</text>
<rect x="42" y="650" width="310" height="100" rx="12" fill="#fff" stroke="#b8c6d8"/><text x="64" y="682" class="s">Prevent</text><text x="64" y="707" class="p">SCPs • IAM • security groups</text><text x="64" y="729" class="p">OIDC trust and policy gates</text>
<rect x="384" y="650" width="310" height="100" rx="12" fill="#fff" stroke="#b8c6d8"/><text x="406" y="682" class="s">Detect</text><text x="406" y="707" class="p">CloudTrail • Config • GuardDuty</text><text x="406" y="729" class="p">Security Hub findings</text>
<rect x="726" y="650" width="310" height="100" rx="12" fill="#fff" stroke="#b8c6d8"/><text x="748" y="682" class="s">Respond</text><text x="748" y="707" class="p">Runbooks • owners • escalation</text><text x="748" y="729" class="p">Containment and recovery</text>
<rect x="1068" y="650" width="290" height="100" rx="12" fill="#fff" stroke="#b8c6d8"/><text x="1090" y="682" class="s">Verify</text><text x="1090" y="707" class="p">CI checks • plan review</text><text x="1090" y="729" class="p">Coverage and evidence</text>
</svg>